name: Agent Feed

# Pravi ispravljene feedove (tabela agent_feeds) i objavljuje ih u Supabase Storage (bucket "feeds").
# Pokreće ga Supabase pg_cron svakog sata u :41 (migracija 007); GitHub "schedule" je preskakao pokretanja.
# Ako je ulazni feed pokvaren, ništa se ne objavljuje (ostaje poslednji ispravan) i job pada → GitHub šalje email.
# Secrets: SUPABASE_SERVICE_ROLE_KEY.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generisanje i objava feedova
        env:
          SUPABASE_URL: https://prfcnhlunpnewankxhdn.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node tools/agent-feed/build.mjs --all
